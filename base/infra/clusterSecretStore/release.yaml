---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: root-secret-store
spec:
  # Used to select the correct ESO controller (think: ingress.ingressClassName)
  # The ESO controller is instantiated with a specific controller name
  # and filters ES based on this property
  # Optional
  # controller: dev

  # provider field contains the configuration to access the provider
  # which contains the secret exactly one provider must be configured.
  provider:
    # (1): AWS Secrets Manager
    # aws configures this store to sync secrets using AWS Secret Manager provider
    aws:
      service: SecretsManager
      # Role is a Role ARN which the SecretManager provider will assume
      # role:  ${external_secrets_sa_role_arn}
      # AWS Region to be used for the provider
      region: ${region} # us-east-1 # ${region}
      # Auth defines the information necessary to authenticate against AWS
      auth:
        ## Getting the accessKeyID and secretAccessKey from an already created Kubernetes Secret
        #secretRef:
        #  accessKeyIDSecretRef:
        #    name: awssm-secret
        #    key: access-key
        #  secretAccessKeySecretRef:
        #    name: awssm-secret
        #    key: secret-access-key
        # IAM roles for service accounts
        # https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts-technical-overview.html
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: services

    # (3): Kubernetes provider
    #kubernetes:
    #  server:
    #    url: "https://myapiserver.tld"
    #    caProvider:
    #      type: Secret
    #      name: my-cluster-secrets
    #      namespace: example
    #      key: ca.crt
    #  auth:
    #    serviceAccount:
    #      name: "example-sa"
    #      namespace: "example"

  # Conditions about namespaces in which the ClusterSecretStore is usable for ExternalSecrets
  conditions:
    # Options are namespaceSelector, namespaces or namespacesRegex
    #- namespaceSelector:
    #    matchLabels:
    #      my.namespace.io/some-label: "value" # Only namespaces with that label will work

    #- namespaces:
    #    - "cms"
    #    - "frontend"
    #    - "flux-system"

    # Namespace regexes are useful for policy management or when external 
    # tools auto-generate namespaces with prefixes/suffixes
    - namespaceRegexes:
        - ".*-cms"
        - ".*-frontend"
        - 'flux-system'
        - 'monitoring'
        - 'sonarqube'
        - 'sftp-client'
        - 'eko-stack'
        - 'service-atlas'
        - 'admin-gateway'
        #- "namespace-a-.*" # All namespaces prefixed by namespace-a- will work
    #    - "namespace-b-.*" # All namespaces prefixed by namespace-b- will work

    # conditions needs only one of the conditions to meet for the CSS to be usable in the namespace.

