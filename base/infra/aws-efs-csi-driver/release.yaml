---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aws-efs-csi-driver
  namespace: kube-system
spec:
  releaseName: aws-efs-csi-driver
  targetNamespace: kube-system
  chart:
    spec:
      chart: aws-efs-csi-driver
      version: "3.2.4"
      sourceRef:
        kind: HelmRepository
        name: aws-fsx-csi-driver
        namespace: flux-system
  interval: 1h
  values:
    replicaCount: 2
    node:
      serviceAccount:
        create: true
        name: efs-csi-node-sa
        annotations:
         eks.amazonaws.com/role-arn: ${efs_csi_sa_role_arn}
    controller:
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
      - effect: NoSchedule
        key: pool
        operator: Equal
        value: infra
      serviceAccount:
        create: true
        name: efs-csi-controller-sa
        annotations:
         eks.amazonaws.com/role-arn: ${efs_csi_sa_role_arn}
      replicaCount: 2
    #storageClasses:
    #- name: efs-sc
    #  provisioner: efs.csi.aws.com
    #  reclaimPolicy: Delete
    #  volumeBindingMode: Immediate