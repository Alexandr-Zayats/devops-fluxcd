---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  dependsOn:
    - name: node-pool.infra
  interval: 1h
  prune: true
  wait: true
  timeout: 5m
  force: true
  sourceRef:
    kind: GitRepository
    name: base
    namespace: flux-system
  path: ./services/internal-certs/cert-manager
  targetNamespace: cert-manager
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager
      namespace: cert-manager


---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aws-privateca-issuer
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
  interval: 1h
  prune: true
  wait: true
  timeout: 5m
  force: true
  sourceRef:
    kind: GitRepository
    name: base
    namespace: flux-system
  path: ./services/internal-certs/aws-privateca-issuer
  targetNamespace: cert-manager
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: aws-privateca-issuer
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: aws-privateca-issuer
      namespace: cert-manager

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-issuer
  namespace: flux-system
spec:
  dependsOn:
    - name: aws-privateca-issuer
  interval: 1h
  prune: true
  wait: true
  timeout: 5m
  force: true
  sourceRef:
    kind: GitRepository
    name: base
    namespace: flux-system
  path: ./services/internal-certs/ClusterIssuer
  targetNamespace: cert-manager
  healthChecks:
    - apiVersion: awspca.cert-manager.io/v1beta1
      kind: AWSPCAClusterIssuer
      name: aws-private-ca
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: terraform-to-flux-bridge
        optional: true
