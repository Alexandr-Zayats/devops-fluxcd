---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-policy
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cert-manager-policy
      sourceRef:
        kind: HelmRepository
        name: cert-manager
      version: v0.3.0
  interval: 1h0m0s
  releaseName: cert-manager-policy
  targetNamespace: kube-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
