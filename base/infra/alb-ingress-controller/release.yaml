apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alb-ingress
spec:
  releaseName: alb-ingress
  chart:
    spec:
      chart: aws-load-balancer-controller
      sourceRef:
        kind: HelmRepository
        name: eks-charts
        namespace: flux-system
      #version: "1.4.1"
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  values:
    replicaCount: 1
