---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: elastic-operator
  namespace: flux-system
spec:
  releaseName: elastic-operator
  targetNamespace: flux-system
  chart:
    spec:
      chart: eck-operator
      sourceRef:
        kind: HelmRepository
        name: elastic
        namespace: flux-system
      version: 2.16.1
  interval: 1h0m0s
  install:
    createNamespace: true
    remediation:
      retries: 5
  values:
    tolerations:
      - effect: NoSchedule
        key: pool
        operator: Equal
        value: infra
    configKubernetes:
      watched_namespace: "*"
    resources:
      limits:
        memory: 500Mi
      requests:
        cpu: 100m
        memory: 250Mi
