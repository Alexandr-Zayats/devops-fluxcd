---

apiVersion: 'helm.toolkit.fluxcd.io/v2'
kind: 'HelmRelease'
metadata:
  name: 'elastalert2'
spec:
  releaseName: 'elastalert2'
  chart:
    spec:
      chart: 'elastalert2'
      sourceRef:
        kind: 'HelmRepository'
        name: 'elastalert2'
        namespace: 'flux-system'
      version: '2.15.0'
  interval: '1h0m0s'
  install:
    remediation:
      retries: 5
  valuesFrom:
    - kind: 'Secret'
      name: 'elasticsearch-es-elastic-user'
      valuesKey: 'elastic'
      targetPath: 'elastic'
  values:
    image:
      # docker image
      repository: 'docker-proxy.suntechinnovation.com/jertel/elastalert2'
      # docker image tag
      tag: '2.15.0'
      pullPolicy: 'IfNotPresent'
      pullSecret: ''
    elasticsearch:
      host: 'elasticsearch-es-data'
      port: 9200
      useSsl: 'True'
      username: 'elastic'
      credentialsSecret: 'elasticsearch-es-elastic-user'
      credentialsSecretPasswordKey: 'elastic'
      verifyCerts: 'False'
    metrics:
      enabled: 'true'
      serviceMonitor:
        enabled: 'true'
        namespace: 'monitoring'
        labels:
          release: 'prometheus-operator'
      prometheusRule:
        enabled: 'true'
        rules: |-
            groups:
              - name: elastalert
                rules:
                  - alert: elastalert Pod down
                    annotations:
                      description: Prometheus is unable to scrape metrics service. Check pod logs for details
                      summary: elastalert POD is down
                    expr: up{service="{{ template "common.names.servicename" . }}",container="elastalert"} == 0
                    for: 5m
                    labels:
                      severity: critical
                      production: 'True'
                  - alert: elastalert file descriptors use
                    annotations:
                      description: Elastalert pod nearly exhausting file descriptors
                      summary: too many file descriptors used
                    expr: |-
                        process_open_fds{service="{{ template "common.names.servicename" . }}",container="elastalert"}
                        /
                        process_max_fds{service="{{ template "common.names.servicename" . }}",container="elastalert"}
                        > 0.9
                    for: 3m
                    labels:
                      severity: critical
                      production: 'True'
                  - alert: elastalert scrapes failing
                    annotations:
                      description: Elastalert is not scraping for a rule {{ "{{" }} $labels.rule_name  {{ "}}" }}
                      summary: scrapes for rule stalled {{ "{{" }} $labels.rule_name {{ "}}" }}
                    expr: |-
                        rate(elastalert_scrapes_total{service="{{ template "common.names.servicename" . }}",container="elastalert"}[1m]) == 0
                    for: 5m
                    labels:
                      severity: critical
                      production: 'True'
