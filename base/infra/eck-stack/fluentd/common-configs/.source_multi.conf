<source>
  @type tail
  path "#{ENV['SOURCE_LOGS'] || '/var/log/containers/*.log'}"
  pos_file /var/log/containers.log.pos
  exclude_path "#{ENV['EXLUDE_LOGS'] || '[ "/var/log/containers/styx*", "/var/log/containers/fluent*", "/var/log/containers/elast*", "/var/log/containers/mysql*" ]'}"
  tag kubernetes.*
  read_from_head true

  <parse>
    @type cri
    <parse>
      @type multi_format
      <pattern>
        format json
        time_format %Y-%m-%d %H:%M:%S.%L
        time_key @timestamp
      </pattern>
      <pattern>
        # nginx logs format json
        format json
        time_format %Y-%m-%dT%H:%M:%S:%z
      </pattern>
      <pattern>
        format json
        time_format %s.%L
      </pattern>
    </parse>
  </parse>
</source>
