<filter **>
  @type grep
  <exclude>
    key "log"
    pattern ^\n$
  </exclude>
</filter>

<match kubernetes.var.log.containers.**kube-logging**.log>
  @type null
</match>
<match kubernetes.var.log.containers.**kube-system**.log>
  @type null
</match>
<match kubernetes.var.log.containers.**monitoring**.log>
  @type null
</match>
<match kubernetes.var.log.containers.**infra**.log>
  @type null
</match>
<match kubernetes.var.log.containers.**elastic-stack**.log>
  @type null
</match>
<match kubernetes.var.log.containers.**eck-stack**.log>
  @type null
</match>

# <filter kubernetes.**>
#   @type detect_exceptions
#   @id k8s_detect_exceptions
#   # key_message message
#   # key_backtrace backtrace
#   languages ["php", "java", "python", "ruby"]
#   multiline_flush_interval 0.1
# </filter>

<filter kubernetes.**>
  @type record_transformer
  enable_ruby true
  <record>
    env_from_ns ${ns = record.dig("kubernetes","namespace_name") || ""; ns.empty? ? nil : ns.split('-').first}
  </record>
</filter>

<match kubernetes.**>
  @type rewrite_tag_filter
  capitalize_regex_backreference true
  <rule>
    key env_from_ns
    pattern /^dev$/
    tag dev.${tag}
  </rule>
  <rule>
    key env_from_ns
    pattern /^test$/
    tag test.${tag}
  </rule>
  <rule>
    key env_from_ns
    pattern /^prod$/
    tag prod.${tag}
  </rule>
  <rule>
    key env_from_ns
    pattern /^stg$/
    tag stg.${tag}
  </rule>
  <rule>
    key env_from_ns
    pattern /^kan$/
    tag kan.${tag}
  </rule>
  <rule>
    key tag
    pattern /.*/
    tag ${tag}
  </rule>
</match>
