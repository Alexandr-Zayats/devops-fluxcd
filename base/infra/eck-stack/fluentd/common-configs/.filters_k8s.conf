<filter kubernetes.**>
  @type grep
  <regexp>
    key log
    pattern /^\{.*\}$/
  </regexp>
</filter>

<filter kubernetes.**>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field true
  <parse>
    @type multi_format
    #<pattern>
    #  format json_in_json
    #  time_key datetime
    #  time_type string
    #  time_format %Y-%m-%dT%H:%M:%S.%N%:z
    #</pattern>
    <pattern>
      format json
      time_key datetime
      time_type string
      time_format %Y-%m-%dT%H:%M:%S.%N%:z
      string_fields traces,additional,context
    </pattern>
    <pattern>
      format json
      time_key timestamp
      time_type float
      time_format %s.%L
      string_fields traces,additional,context
    </pattern>
    #<pattern>
    #  format none
    #</pattern>
  </parse>
</filter>

<filter kubernetes.**>
  @type kubernetes_metadata
  kubelet_node_name "#{ENV['K8S_NODE_NAME'] || 'unknown'}"
</filter>

