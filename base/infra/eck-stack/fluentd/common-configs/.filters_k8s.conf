<filter kubernetes.**>
  @type record_transformer
  enable_ruby true
  <record>
    env "#{ENV['FLUENT_ENV'] || 'main'}"
    service ${record['kubernetes']['pod_name'].split('-')[0]} # ${record["kubernetes"]["labels"]["app"]}
    for_remove ${if record["kubernetes"]; then record["kubernetes"].delete("labels"); record["kubernetes"].delete("namespace_labels"); record["kubernetes"].delete("container_image_id"); record["kubernetes"].delete("master_url"); record["kubernetes"].delete("namespace_id"); record["kubernetes"].delete("pod_id"); record["kubernetes"].delete("pod_ip"); record["kubernetes"].delete("container_image"); record["kubernetes"].delete("container_name"); end;  nil}
  </record>
  remove_keys for_remove
</filter>

<filter kubernetes.**>
  @type record_transformer
  enable_ruby true
  <record>
    expected_tag ${begin; ns = record.dig("kubernetes","namespace_name") || ""; base = tag; if ns.start_with?("dev-"); "dev.#{base}"; elsif ns.start_with?("test-"); "test.#{base}"; elsif ns.start_with?("prod-"); "prod.#{base}"; elsif ns.start_with?("stg-"); "stg.#{base}"; elsif ns.start_with?("kan-"); "kan.#{base}"; else base; end; end}
  </record>
</filter>

<filter **>
  @type record_transformer
  remove_keys Isid,config,attr,docker,ts,stream,controller,controllerGroup,controllerKind,output,kubernetes.namespace_labels,prefix,request
</filter>
