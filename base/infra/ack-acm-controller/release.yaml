---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ack-acm-controller
spec:
  releaseName: ack-acm-controller
  interval: 60m
  targetNamespace: services
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: acm-chart
      version: "1.4.0"
      sourceRef:
        kind: HelmRepository
        name: ack
        namespace: flux-system
      interval: 24h
  values:
    aws:
      region: ${region}
    deletionPolicy: retain
    log:
      level: debug    
    serviceAccount:
      create: true
      name: ack-acm-controller
      annotations:
        eks.amazonaws.com/role-arn: ${common_role_arn}
    deployment:
      tolerations:
        - effect: NoSchedule
          key: pool
          operator: Equal
          value: infra
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
    reconcile:
      defaultResyncPeriod: 60
