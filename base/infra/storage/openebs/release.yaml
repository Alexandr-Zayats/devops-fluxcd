apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-provisioner
spec:
  releaseName: nfs-provisioner
  chart:
    spec:
      chart: nfs-provisioner
      sourceRef:
        kind: HelmRepository
        name: openebs-nfs
        namespace: flux-system
      version: "0.10.1"
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  values:
    nfsProvisioner:
      name: nfs-provisioner
      enabled: true
    nodeSelector:
      application: services
    nfsStorageClass:
      name: nfs
      reclaimPolicy: Delete
      nfsServerType: kernel
      isDefaultClass: false
      backendStorageClass: "gp2-resize-csi"
