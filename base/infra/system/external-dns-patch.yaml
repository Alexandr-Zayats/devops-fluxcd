---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: devops
spec:
  releaseName: external-dns
  targetNamespace: devops
  values:
    domainFilters:
      - ${env_dns_zone_name}
      - devops.ab.techtellent.io
    txtPrefix: ${eks_cluster_name}
    txtOwnerId: ${env_dns_zone_id}
    serviceAccount:
      annotations:
       eks.amazonaws.com/role-arn: ${external_dns_sa_role_arn}

    nodeSelector:
      pool: infra
    tolerations:
    - effect: NoSchedule
      key: pool
      operator: Equal
      value: infra