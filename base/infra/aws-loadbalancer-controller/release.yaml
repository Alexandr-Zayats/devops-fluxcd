---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alb-controler
spec:
  releaseName: alb-controler
  uninstall:
    disableHooks: true
    keepHistory: false
  interval: 60m
  targetNamespace: kube-system
  chart:
    spec:
      chart: aws-load-balancer-controller
      version: "1.14.1"
      sourceRef:
        kind: HelmRepository
        name: eks-charts
        namespace: flux-system
      interval: 24h
  values:
    clusterName: "${eks_cluster_name}"
    vpcId: "${vpc_id}"
    ingressClass: alb
    createIngressClassResource: true
    serviceAccount:
      create: true
      name: aws-load-balancer-controller
    rbac:
      create: true
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 256Mi
