---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ${poolName}
  namespace: ${karpenter_namespace}
spec:
  disruption:
    budgets:
      - nodes: 50%
    consolidateAfter: 30s
    consolidationPolicy: WhenEmptyOrUnderutilized
  limits:
    cpu: ${limits_cpu}
  template:
    metadata:
      labels:
        pool: ${poolName}
    spec:
      expireAfter: Never
      nodeClassRef:
        name: ${classRef}
        group: karpenter.k8s.aws
        kind: EC2NodeClass
      requirements:
      - key: node.kubernetes.io/instance-type
        operator: In
        values:
        - c6a.medium
        - c6a.large
      - key: karpenter.sh/capacity-type
        operator: In
        values:
        - on-demand
      - key: kubernetes.io/arch
        operator: In
        values:
        - amd64
      - key: kubernetes.io/os
        operator: In
        values:
        - linux
      - key: topology.kubernetes.io/zone
        operator: In
        values:
        - ${region}a
        - ${region}b
        - ${region}d
      taints:
      - effect: NoSchedule
        key: pool
        value: ${poolName}
