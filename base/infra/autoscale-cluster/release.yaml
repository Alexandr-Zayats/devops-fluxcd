apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: autoscaler
spec:
  releaseName: autoscaler
  chart:
    spec:
      chart: cluster-autoscaler
      sourceRef:
        kind: HelmRepository
        name: autoscaler
        namespace: flux-system
      version: "9.10.8"
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  values:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: application
              operator: In
              values:
              - services
    cloudProvider: aws
    extraArgs:
      skip-nodes-with-system-pods: false
      skip-nodes-with-local-storage: false