apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kafka-ui
spec:
  releaseName: kafka-ui
  chart:
    spec:
      chart: kafka-ui
      sourceRef:
        kind: HelmRepository
        name: kafka-ui
        namespace: flux-system
      version: "*"
  interval: 1h0m0s
  install:
    remediation:
      retries: 2
