---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-cleanup-cluster-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-cleanup-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-cleanup-cluster-role
subjects:
- kind: ServiceAccount
  name: pod-cleanup-sa
  namespace: gitlab-runner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-cleanup-sa
  namespace: gitlab-runner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-runner-pod-cleanup
  namespace: gitlab-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab-runner-pod-cleanup
  template:
    metadata:
      labels:
        app: gitlab-runner-pod-cleanup
    spec:
      restartPolicy: Always
      serviceAccountName: pod-cleanup-sa
      containers:
      - name: gitlab-runner-pod-cleanup
        # N.B. there is NO arm build :(
        # image: registry.gitlab.com/gitlab-org/ci-cd/gitlab-runner-pod-cleanup:latest
        image: twistersfury/gitlab-runner-pod-cleanup:latest
        env:
          - name: POD_CLEANUP_LOG_LEVEL
            value: debug
          - name: POD_CLEANUP_KUBERNETES_NAMESPACES
            value: "runners-games,runners-portal,runners-shared-light"
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
      - effect: NoSchedule
        key: pool
        operator: Equal
        value: infra
