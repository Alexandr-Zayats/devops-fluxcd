apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ps-db
spec:
  releaseName: ps-db
  chart:
    spec:
      chart: ps-db
      sourceRef:
        kind: HelmRepository
        name: percona
        namespace: flux-system
      version: "0.6.5"
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  values:
    finalizers:
      - delete-mysql-pods-in-order
      # - delete-ssl
    crVersion: 0.6.0
    pause: false
    allowUnsafeConfigurations: false
    updateStrategy: SmartUpdate
    upgradeOptions:
      versionServiceEndpoint: https://check.percona.com
      apply: disabled

    mysql:
      clusterType: async
      autoRecovery: true
      size: 1

      configuration: |
        max_connections=200
        innodb_buffer_pool_size=512M
        binlog_expire_logs_seconds=172800

      resources:
        requests:
          memory: 512M
        limits:
          memory: 1G

      affinity:
        antiAffinityTopologyKey: "kubernetes.io/hostname"
      volumeSpec:
        pvc:
          resources:
            requests:
              storage: 20G
      annotations: {}
      labels: {}
      nodeSelector: {}
      tolerations: []
    proxy:
      haproxy:
        enabled: true
        size: 1
        resources:
          requests:
            memory: 128M
            cpu: 100m
          limits: {}

        affinity:
          antiAffinityTopologyKey: "kubernetes.io/hostname"
        nodeSelector: {}
        tolerations: []
      router:
        enabled: false

    orchestrator:
      enabled: false

    pmm:
      enabled: false

    backup:
      enabled: false
      resources:
        requests: {}
        limits: {}
      storages: {}

    toolkit:
      image:
        repository: percona/percona-server-mysql-operator
        tag: 0.6.0-toolkit
      imagePullPolicy: Always
      resources:
        requests: {}
        limits: {}

    # Secret with passwords is by default generated by operator.
    # Specify "secretsName" for custom secret name.
    # Uncomment below if you want to manage with helm.
    # passwords:
    #   root: insecure_root_password
    #   xtrabackup: insecure_backup_password
    #   monitor: insecure_monitor_password
    #   pmmserverkey: my_pmm_server_key
    #   operator: insecure_operator_password
    #   replication: insecure_replication_password
    #   orchestrator: insecure_orchestrator_password
    #   heartbeat: heartbeat_password
