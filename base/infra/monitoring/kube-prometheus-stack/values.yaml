---
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverError: true
    kubeApiserverSlos: true
    kubelet: true
    kubePrometheusGeneral: true
    kubePrometheusNodeAlerting: true
    kubePrometheusNodeRecording: true
    kubernetesAbsent: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: true
    kubeStateMetrics: true
    network: true
    node: true
    prometheus: true
    prometheusOperator: true
    time: true
kubeControllerManager:
  enabled: false
kubeScheduer:
  enabled: false
kubeProxy:
  enabled: false
prometheus:
  enabled: ${PrometheusEnabled}
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    tolerations:
      - effect: NoSchedule
        key: pool
        operator: Equal
        value: infra

    #affinity:
    #  nodeAffinity:
    #    requiredDuringSchedulingIgnoredDuringExecution:
    #      nodeSelectorTerms:
    #      - matchExpressions:
    #        - key: application
    #          operator: In
    #          values:
    #          - services
      
alertmanager:
  enabled: ${AlertmanagerEnabled}
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['job']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'slack'
      routes:
      - receiver: 'null'
        matchers:
          - alertname =~ "InfoInhibitor|Watchdog"
    receivers:
    - name: 'null'
    - name: 'slack'
      slack_configs:
      - channel: '#k8s'
        send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] Monitoring Event Notification'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }} - `{{ .Labels.severity }}`
            *Description:* {{ .Annotations.description }}
            *Details:*
            {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
            {{ end }}
          {{ end }}
  alertmanagerSpec:
    tolerations:
      - effect: NoSchedule
        key: pool
        operator: Equal
        value: infra
    #affinity:
    #  nodeAffinity:
    #    requiredDuringSchedulingIgnoredDuringExecution:
    #      nodeSelectorTerms:
    #      - matchExpressions:
    #        - key: application
    #          operator: In
    #          values:
    #          - services
nodeExporter:
  enabled: ${NodeExporterEnabled}

kube-state-metrics:
  tolerations:
    - effect: NoSchedule
      key: pool
      operator: Equal
      value: infra
  #affinity:
  #  nodeAffinity:
  #    requiredDuringSchedulingIgnoredDuringExecution:
  #      nodeSelectorTerms:
  #      - matchExpressions:
  #        - key: application
  #          operator: In
  #          values:
  #          - services
prometheusOperator:
  enabled: ${PrometheusOperatorEnabled}
  admissionWebhooks:
    patch:
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
        - effect: NoSchedule
          key: pool
          operator: Equal
          value: monitoring
    create:
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
        - effect: NoSchedule
          key: pool
          operator: Equal
          value: monitoring
  nodeSelector:
    kubernetes.io/arch: arm64
  tolerations:
    - effect: NoSchedule
      key: pool
      operator: Equal
      value: monitoring
  #admissionWebhooks:
  #  deployment:
  #    tolerations:
  #      - effect: NoSchedule
  #        key: pool
  #        operator: Equal
  #        value: infra
  #  patch:
  #    tolerations:
  #      - effect: NoSchedule
  #        key: pool
  #        operator: Equal
  #        value: infra

grafana:
  enabled: ${GrafanaEnabled}
  tolerations:
    - effect: NoSchedule
      key: pool
      operator: Equal
      value: infra
  #affinity:
  #  nodeAffinity:
  #    requiredDuringSchedulingIgnoredDuringExecution:
  #      nodeSelectorTerms:
  #      - matchExpressions:
  #        - key: application
  #          operator: In
  #          values:
  #          - services
  adminPassword: ""
  ingress:
    enabled: true
    spec:
      ingressClassName: private-shared
      rules:
        - host: grafana.${int_zone_name}
          http:
            paths:
              - backend:
                  service:
                    name: grafana-service
                    port:
                      number: 3000
                path: /
                pathType: Prefix

    #annotations:
    #  kubernetes.io/ingress.class: nginx
  grafana.ini:
    auth.ldap:
      enabled: false
      allow_sign_up: true
      config_file: /etc/grafana/ldap.toml
  ldap:
    enabled: true
    existingSecret: ""
    config: |-
      verbose_logging = true
      [[servers]]
      host = "ad.${int_zone_name}"
      port = 389
      use_ssl = false
      start_tls = false
      ssl_skip_verify = true
      bind_dn = "grafana.service@ad.${int_zone_name}"
      bind_password = 'rrnPIYajwuQDkx2ljooU'
      search_filter = "(userPrincipalName=%s)"
      search_base_dns = ["dc=ad,dc=demo-platform,dc=ca"]
      [servers.attributes]
      name = "displayName"
      surname = "sn"
      username = "sAMAccountName"
      member_of = "memberOf"
      email =  "mail"
      [[servers.group_mappings]]
      group_dn = "cn=demo-platform Grafana Admin,ou=Grafana,ou=Security Groups,ou=Groups,ou=BEDHUNDER,dc=ad,dc=demo-platform,dc=ca"
      org_role = "Admin"
      grafana_admin = true
      [[servers.group_mappings]]
      group_dn = "cn=Bedhunder Grafana Editor,ou=Grafana,ou=Security Groups,ou=Groups,ou=BEDHUNDER,dc=ad,dc=bedhunder,dc=ca"
      org_role = "Editor"
      [[servers.group_mappings]]
      group_dn = "cn=Bedhunder Grafana Viewer,ou=Grafana,ou=Security Groups,ou=Groups,ou=BEDHUNDER,dc=ad,dc=bedhunder,dc=ca"
      org_role = "Viewer"
