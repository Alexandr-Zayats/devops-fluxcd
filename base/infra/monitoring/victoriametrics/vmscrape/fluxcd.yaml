apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: fluxcd
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: flux-system
      app.kubernetes.io/part-of: flux
  namespaceSelector:
    matchNames:
      - flux-system
  endpoints:
    - port: http-prom
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
