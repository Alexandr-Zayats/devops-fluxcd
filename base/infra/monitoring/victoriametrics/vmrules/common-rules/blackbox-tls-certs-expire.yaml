---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  labels:
    project: devops
  name: blackbox-tls-certs-expire
  namespace: monitoring
spec:
  groups:
    - name: tls-certificate-exp-checks
      rules:
        # - alert: ProbeFailed
        #   annotations:
        #     description: |-
        #       Probe failed
        #         VALUE = {{ $value }}
        #         LABELS: {{ $labels }}
        #     summary: Probe failed (instance {{ $labels.instance }})
        #   expr: probe_success == 0
        #   for: 5m
        #   labels:
        #     severity: critical
        #     component: ssl-checker
        # - alert: HttpStatusCode
        #   annotations:
        #     description: |-
        #       HTTP status code is not 200-399
        #         VALUE = {{ $value }}
        #         LABELS: {{ $labels }}
        #     summary: HTTP Status Code (instance {{ $labels.instance }})
        #   expr: probe_http_status_code <= 199 OR probe_http_status_code >= 400
        #   for: 5m
        #   labels:
        #     severity: critical
        #     component: ssl-checker
        - alert: SslCertificateWillExpireSoon_10_days
          annotations:
            description: |-
              SSL certificate expires in 10 days
                VALUE = {{ $value }}
                LABELS: {{ $labels }}
            summary: SSL certificate will expire soon (instance {{ $labels.instance }})
          expr: probe_ssl_earliest_cert_expiry{job="kube-api-ssl-blackbox"} - time() < 86400 * 10
          for: 5m
          labels:
            severity: warning
            component: ssl-checker
        - alert: SslCertificateWillExpireSoon_1_day
          annotations:
            description: |-
              SSL certificate expires in 1 days
                VALUE = {{ $value }}
                LABELS: {{ $labels }}
            summary: SSL certificate will expire soon (instance {{ $labels.instance }})
          expr: probe_ssl_earliest_cert_expiry{job="kube-api-ssl-blackbox"} - time() <= 86400
          for: 5m
          labels:
            severity: critical
            component: ssl-checker
        - alert: SslCertificateHasExpired
          annotations:
            description: |-
              SSL certificate has expired already
                VALUE = {{ $value }}
                LABELS: {{ $labels }}
            summary: SSL certificate has expired (instance {{ $labels.instance }})
          expr: probe_ssl_earliest_cert_expiry{job="kube-api-ssl-blackbox"} - time() <= 0
          for: 5m
          labels:
            severity: critical
            component: ssl-checker
