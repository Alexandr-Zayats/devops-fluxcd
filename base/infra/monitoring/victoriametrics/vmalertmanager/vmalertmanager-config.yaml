---
apiVersion: v1
kind: Secret
metadata:
  name: vmalertmanager-config
  labels:
    owner: devops
    stream: devops
    env: ${env}
    product: observability
    app: vmalertmanager-secret
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    templates:
      - "/etc/vm/templates/**/*.tmpl"
    route:
      group_by: ['alertname', 'kubeClusterName', 'job', 'env', 'component', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      receiver: slack
      routes:
        - receiver: slack-critical-non-prod
          match_re:
            # cluster: demo-platform-tools-0|demo-platform-test-0|demo-platform-dev-0|demo-platform-stg-0|demo-platform-prod-0
            # component: 'system|apps'
            # env: demo-platform
            severity: critical
            kubeClusterName: demo-platform-dev-1|demo-platform-tools-1|demo-platform-stg-0|demo-platform-prod-1
        - receiver: slack-warnings-non-prod
          match_re:
            # cluster: demo-platform-tools-0|demo-platform-test-0|demo-platform-dev-0|demo-platform-stg-0|demo-platform-prod-0
            # component: 'system|apps'
            # env: demo-platform
            severity: warning
            kubeClusterName: demo-platform-dev-1|demo-platform-tools-1|demo-platform-test-1|demo-platform-stg-0
        - receiver: slack
          match_re:
            # cluster: demo-platform-tools-0|demo-platform-test-0|demo-platform-dev-0|demo-platform-stg-0|demo-platform-prod-1
            # component: 'system|apps'
            # env: demo-platform
            severity: info
    receivers:
      - name: 'slack-critical-non-prod'
        slack_configs:
        - channel: '#critical-non-prod'
          api_url: '${SLACK_WEBHOOK_URL_CRITICAL_NON_PROD}'
          send_resolved: true
          title: '{{ template "slack.demo-platform.title" . }}'
          text: '{{ template "slack.demo-platform.text" . }}'
      - name: 'slack-warnings-non-prod'
        slack_configs:
        - channel: '#warnings-non-prod'
          api_url: '${SLACK_WEBHOOK_URL_WARNINGS_NON_PROD}'
          send_resolved: true
          title: '{{ template "slack.demo-platform.title" . }}'
          text: '{{ template "slack.demo-platform.text" . }}'
      - name: 'slack'
        slack_configs:
        - channel: '#monitoring'
          api_url: '${SLACK_WEBHOOK_URL_MONITORING}'
          send_resolved: true
          title: '{{ template "slack.demo-platform.title" . }}'
          text: '{{ template "slack.demo-platform.text" . }}'
