---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: monitoring
spec:
  interval: 15m
  chart:
    spec:
      chart: grafana-operator
      version: v5.18.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    tolerations:
      - effect: NoSchedule
        key: pool
        operator: Equal
        value: monitoring
