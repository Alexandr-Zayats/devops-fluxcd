---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-metrics
spec:
  datasource:
    name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://vmselect-vmcluster-persistent:8481/select/0/prometheus
    # url: http://vmselect.tools.demo-platform.int  # /select/0/prometheus
    isDefault: true
    # editable: true
    jsonData:
      timeInterval: 5s
      tlsSkipVerify: true
  instanceSelector:
    matchLabels:
      datasource: grafana
  plugins:
    - name: grafana-clock-panel
      version: 2.1.8
