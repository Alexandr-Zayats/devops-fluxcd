---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-redis-exporter
  namespace: monitoring
spec:
  releaseName: prometheus-redis-exporter
  chart:
    spec:
      chart: prometheus-redis-exporter
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      version: "6.0.0"
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: prometheus-redis-exporter-values
      valuesKey: values.yaml
