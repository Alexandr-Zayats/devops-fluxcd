---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  releaseName: traefik
  targetNamespace: traefik
  interval: 10m
  install:
    crds: Create
    remediation:
      retries: 3
    timeout: 5m
    createNamespace: true
  upgrade:
    crds: CreateReplace
  uninstall:
    disableHooks: true
    keepHistory: false
  chart:
    spec:
      chart: traefik
      version: "40.3.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    deployment:
      replicas: 3
    nodeSelector:
      kubernetes.io/arch: arm64
    tolerations:
      - effect: NoSchedule
        key: pool
        operator: Equal
        value: infra
    service:
      spec:
        type: ClusterIP
    ports:
      web:
        port: 8000
        forwardedHeaders:
          insecure: true
      websecure:
        port: 8443
    providers:
      kubernetesIngress:
        enabled: true
        ingressClass: traefik
      kubernetesCRD:
        enabled: true
        ingressClass: traefik
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik
    ingressRoute:
      healthcheck:
        enabled: true
        entryPoints:
          - web
