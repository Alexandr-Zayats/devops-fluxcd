---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${name}
  annotations:
    alb.ingress.kubernetes.io/group.name: ${group_name}
    alb.ingress.kubernetes.io/scheme: ${scheme}
    alb.ingress.kubernetes.io/group.name: apps-public  # {{ .Values.ingress.group }}
    #alb.ingress.kubernetes.io/healthcheck-path: '{{ .Values.readinessProbe.httpGet.path }}'
    #alb.ingress.kubernetes.io/healthcheck-protocol: '{{ .Values.healthcheck.protocol }}'
    #alb.ingress.kubernetes.io/healthcheck-port: '{{ .Values.healthcheck.port }}'
    #alb.ingress.kubernetes.io/healthcheck-interval-seconds: '{{ .Values.healthcheck.intervalSeconds }}'
    #alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '{{ .Values.healthcheck.timeoutSeconds }}'
    #alb.ingress.kubernetes.io/healthy-threshold-count: '{{ .Values.healthcheck.healthyThresholdCount }}'
    #alb.ingress.kubernetes.io/unhealthy-threshold-count: '{{ .Values.healthcheck.unhealthyThresholdCount }}'
    #alb.ingress.kubernetes.io/success-codes: '{{ .Values.healthcheck.successCodes }}'

    kubernetes.io/ingress.class: 'alb'
    # nginx.ingress.kubernetes.io/proxy-body-size: 500m
    #nginx.ingress.kubernetes.io/rewrite-target: /$1
    alb.ingress.kubernetes.io/certificate-arn:  ${public_ingress_controller_certs}
    alb.ingress.kubernetes.io/target-type: 'ip'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}, {"HTTP": 80}]'
    alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type":"redirect","RedirectConfig":{"Protocol":"HTTPS","Port":"443","StatusCode":"HTTP_301"}}'
spec:
  rules:
    - host: ${host}.${main_domain}
      http:
        paths:
          - backend:
              service:
                name: ${service}
                port:
                  number: ${port}
            path: '/'
            pathType: Prefix
