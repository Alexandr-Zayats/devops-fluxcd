apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb-operator
spec:
  releaseName: mongodb-operator
  chart:
    spec:
      chart: psmdb-operator
      sourceRef:
        kind: HelmRepository
        name: percona
        namespace: flux-system
      version: "1.14.3"
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  values:
    resources:
      limits:
        memory: 512Mi
      requests:
        memory: 512Mi

