apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strimzi-kafka-operator
spec:
  releaseName: strimzi-kafka-operator
  chart:
    spec:
      chart: strimzi-kafka-operator
      sourceRef:
        kind: HelmRepository
        name: strimzi
        namespace: flux-system
      version: "0.39.0"
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  values:
    extraEnvs:
    - name: JAVA_OPTS
      value: "-Xms700m -Xmx700m"
    resources:
      limits:
        memory: 1024Mi
      requests:
        memory: 1024Mi
    watchNamespaces: []
    watchAnyNamespace: false
