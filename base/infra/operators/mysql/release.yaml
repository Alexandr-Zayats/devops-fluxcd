apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mysql-oracle-operator
spec:
  releaseName: mysql-oracle-operator
  chart:
    spec:
      chart: mysql-operator
      sourceRef:
        kind: HelmRepository
        name: mysql-oracle-operator
        namespace: flux-system
      version: "2.1.1"
  interval: 1h0m0s
  install:
    remediation:
      retries: 3