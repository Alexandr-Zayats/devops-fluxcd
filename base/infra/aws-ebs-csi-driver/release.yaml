---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aws-ebs-csi-driver
  namespace: kube-system
spec:
  chart:
    spec:
      chart: aws-ebs-csi-driver
      # version: 2.40.2
      sourceRef:
        kind: HelmRepository
        name: aws-ebs-csi-driver
        namespace: flux-system
  interval: 1h
  values:
    node:
      tolerations:
        - effect: NoSchedule
          key: pool
          operator: Equal
          value: infra
