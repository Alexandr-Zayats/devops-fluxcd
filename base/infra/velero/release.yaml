---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
spec:
  releaseName: velero
  chart:
    spec:
      chart: velero
      sourceRef:
        kind: HelmRepository
        name: velero
        namespace: flux-system
      version: 5.3.0
  interval: 1h0m0s
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 3
  values:
    nodeAgent:
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1024Mi
    configuration:
      backupStorageLocation:
        - name: default
          bucket: S3_BUCKET
          provider: aws
          config:
            region: eu-west-1
      volumeSnapshotLocation:
        - name: default
          provider: aws
          config:
            region: eu-west-1
    podAnnotations:
      iam.amazonaws.com/role: ROLE_ARN
    credentials:
      useSecret: false
    backupsEnabled: true
    snapshotsEnabled: true
    deployNodeAgent: true
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws
        volumeMounts:
          - name: plugins
            mountPath: /target
    schedules:
