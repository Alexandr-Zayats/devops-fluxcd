---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infra-acm-cert
  namespace: flux-system
  annotations:
    eks.amazonaws.com/role-arn: ${common_role_arn}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infra-acm-cert
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch", "update", "delete"]
  - apiGroups: ["acm.services.k8s.aws"]
    resources: ["certificates"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infra-acm-cert
  namespace: flux-system
subjects:
  - kind: ServiceAccount
    name: infra-acm-cert
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infra-acm-cert

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infra-acm-cert-ingress-reader
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infra-acm-cert-ingress-reader
subjects:
  - kind: ServiceAccount
    name: infra-acm-cert
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infra-acm-cert-ingress-reader
