---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
spec:
  values:
    serviceAccount:
      create: true
      name: ""
      automountServiceAccountToken: true
    controller:
      replicaCount: 1
      ingressClass: public-shared
      ingressClassResource:
        controllerValue: k8s.io/public-shared # ingress-nginx
        name: public-shared
      ports:
        https: 443
        http: 80
      #containerPort:
      #  tohttps: 2443
      service:
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        allocateLoadBalancerNodePorts: false
        targetPorts:
          https: http
          http: tohttps
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-name: "public-${eks_cluster_name}"
          service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
          service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
          service.beta.kubernetes.io/aws-load-balancer-ssl-ports: https
          service.beta.kubernetes.io/aws-load-balancer-type: nlb
          service.beta.kubernetes.io/aws-load-balancer-internal: "false"
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
          service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: "preserve_client_ip.enabled=true"
          service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
          service.beta.kubernetes.io/aws-load-balancer-ssl-cert: ${public_ingress_controller_certs}
          nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
