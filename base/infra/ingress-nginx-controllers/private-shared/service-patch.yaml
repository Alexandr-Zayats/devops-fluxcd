---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
spec:
  values:
    serviceAccount:
      create: true
      name: ""
      automountServiceAccountToken: true
    controller:
      ingressClass: private-shared
      ingressClassResource:
        controllerValue: k8s.io/private-shared # ingress-nginx
        name: private-shared
      ports:
        https: 443
        http: 80
      service:
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        allocateLoadBalancerNodePorts: false
        targetPorts:
          https: https
          http: http
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-name: "private-${eks_cluster_name}"
          service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
          service.beta.kubernetes.io/aws-load-balancer-internal: "true"
          service.beta.kubernetes.io/aws-load-balancer-ssl-ports: https
          service.beta.kubernetes.io/aws-load-balancer-type: nlb
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
          service.beta.kubernetes.io/aws-load-balancer-scheme: internal
          # service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: instance
          service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: "preserve_client_ip.enabled=false"
          service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
          nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
          # service.beta.kubernetes.io/aws-load-balancer-ssl-cert: ${private_ingress_controller_certs}
          # service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
