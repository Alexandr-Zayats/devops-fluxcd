---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  # namespace: kyverno
spec:
  interval: 60m
  install:
    timeout: 20m
  upgrade:
    timeout: 20m
  rollback:
    timeout: 20m
  uninstall:
    disableHooks: true
    keepHistory: false
  targetNamespace: kyverno
  chart:
    spec:
      chart: kyverno
      version: 3.7.2
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
      interval: 1h
  #valuesFrom:
  #  - kind: 'ConfigMap'
  #    name: 'kyverno-values'
  #    valuesKey: 'values.yaml'
  values:
    admissionController:
      replicas: 3
      rbac:
        clusterRole:
          extraResources:
            - apiGroups:
              - '*'
              resources:
              - '*'
              verbs:
              - get
              - list
              - watch

    backgroundController:
      replicas: 3
      resources:
        # -- Pod resource limits
        limits:
          memory: 512Mi
        # -- Pod resource requests
        requests:
          cpu: 100m
          memory: 256Mi
      rbac:
        clusterRole:
          extraResources:
            - apiGroups:
              - '*'
              resources:
              - '*'
              verbs:
              - create
              - update
              - delete
              - get
              - list
              - watch
    cleanupController:
      replicas: 2
    reportsController:
      replicas: 2
    global:
      tolerations:
        - key: pool
          value: infra
          operator: Equal
          effect: NoSchedule
