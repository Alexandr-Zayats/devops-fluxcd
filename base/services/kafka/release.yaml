---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # name: redis-cluster
  name: ${env}-${app}-kafka
  namespace: flux-system
spec:
  interval: 10m
  releaseName: kafka
  chart:
    spec:
      chart: kafka
      sourceRef:
        kind: HelmRepository
        name: bitnami-oci
        namespace: flux-system
      version: 32.4.2
  valuesFrom:
    - kind: ConfigMap
      name: kafka-values
      valuesKey: values.yaml
  values:
    controller:
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
        - key: pool
          value: infra
          effect: NoSchedule
    broker:
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
        - key: pool
          value: infra
          effect: NoSchedule
