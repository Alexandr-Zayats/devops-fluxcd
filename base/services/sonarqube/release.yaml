---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarqube
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: sonarqube
      version: 2025.5.0
      sourceRef:
        kind: HelmRepository
        name: sonarqube
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: sonarqube-values
      valuesKey: values.yaml
