---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: services
spec:
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: 0.20.2
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  interval: 5m
  uninstall:
    disableHooks: true
    keepHistory: false
  values:
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: ${external_secrets_sa_role_arn}
    tolerations:
      - key: pool
        value: infra
        effect: NoSchedule
    webhook:
      create: true
      tolerations:
      - key: pool
        value: infra
        effect: NoSchedule

    certController:
      create: true
      tolerations:
      - key: pool
        value: infra
        effect: NoSchedule
