---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openvpn
spec:
  interval: 10m
  releaseName: openvpn
  chart:
    spec:
      chart: openvpn
      sourceRef:
        kind: HelmRepository
        name: demo-platform # devtron
        namespace: flux-system
      version: 4.5.6
  valuesFrom:
    - kind: ConfigMap
      name: openvpn-values
      valuesKey: values.yaml
