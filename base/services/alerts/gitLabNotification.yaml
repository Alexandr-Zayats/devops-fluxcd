---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: gitlab-${APPLICATION}
  namespace: flux-system
spec:
  type: generic # gitlab
  address: https://gitlab.com/api/v4/projects/${ProjectID}/trigger/pipeline?token=${password}&ref=${branch}
  secretRef:
    name: gitlab

---
apiVersion: notification.toolkit.fluxcd.io/v1beta2
kind: Alert
metadata:
  name: ${APPLICATION}-alert
  namespace: flux-system
spec:
  providerRef:
    name: gitlab-${APPLICATION}
  eventSeverity: ${Severity}
  eventSources:
    - kind: Kustomization
      name: ${APPLICATION}
