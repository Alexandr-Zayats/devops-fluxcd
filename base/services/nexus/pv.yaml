apiVersion: v1
kind: PersistentVolume
metadata:
  name: nexus-migrated-pv
spec:
  capacity:
    storage: 30Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gp3-5k-250-ext4
  csi:
    driver: ebs.csi.aws.com
    volumeHandle: vol-02f94ed19f752b3e3
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: topology.ebs.csi.aws.com/zone
          operator: In
          values:
          - us-east-1a
