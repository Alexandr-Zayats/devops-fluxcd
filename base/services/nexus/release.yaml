---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nexus
  namespace: flux-system
spec:
  interval: 10m
  releaseName: nexus-repo
  chart:
    spec:
      chart: nexus-repository-manager
      version: 64.2.0
      sourceRef:
        kind: HelmRepository
        name: nexus
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: nexus-values
      valuesKey: values.yaml
