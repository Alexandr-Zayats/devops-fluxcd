---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # name: redis-cluster
  name: ${env}-${app}-clickhouse
  # namespace: flux-system
spec:
  interval: 10m
  releaseName: clickhouse
  chart:
    spec:
      chart: clickhouse
      sourceRef:
        kind: HelmRepository
        name: bitnami-oci
        namespace: flux-system
      # version: 20.6.2
  values:
    nodeSelector:
      kubernetes.io/arch: arm64
    tolerations:
      - key: pool
        value: infra
        effect: NoSchedule
    keeper:
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
        - key: pool
          value: infra
          effect: NoSchedule
  valuesFrom:
    - kind: ConfigMap
      name: clickhouse-values
      valuesKey: values.yaml
