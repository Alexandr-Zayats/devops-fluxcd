---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${env}-${app}-memcached
  namespace: flux-system
spec:
  interval: 10m
  releaseName: memcached
  chart:
    spec:
      chart: memcached
      sourceRef:
        kind: HelmRepository
        name: bitnami-oci
        namespace: flux-system
      version: 7.9.7
  values:
    nodeSelector:
      arch: arm64
    tolerations:
      - key: pool
        value: infra
        effect: NoSchedule
  valuesFrom:
    - kind: ConfigMap
      name: memcached-values
      valuesKey: values.yaml
