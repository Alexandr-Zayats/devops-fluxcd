---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: statsd
  namespace: flux-system
spec:
  interval: 10m
  releaseName: statsd
  uninstall:
    disableHooks: true
    keepHistory: false
  chart:
    spec:
      chart: statsd
      sourceRef:
        kind: HelmRepository
        name: statsd
        namespace: flux-system
      version: 0.1.19
  values:
    nodeSelector:
      kubernetes.io/arch: arm64
    tolerations:
      - key: pool
        value: infra
        effect: NoSchedule
  valuesFrom:
    - kind: ConfigMap
      name: statsd-values
      valuesKey: values.yaml
