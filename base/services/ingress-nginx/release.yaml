---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
spec:
  interval: 5m
  dependsOn:
    - name: prometheus-crds
      namespace: services
  uninstall:
    disableHooks: true
    keepHistory: false
  chart:
    spec:
      chart: ingress-nginx
      # version: 4.12.1
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
      interval: 1h
  values:
    ingressClassByName: true
    controller:
      config:
        #http-snippet: |-
        #  server {
        #    listen 2443;
        #    return 308 https://$host$request_uri;
        #  }
        log-format-upstream: '{ "time": "$time_iso8601", "remote_addr": "$proxy_protocol_addr",
          "x_forwarded_for": "$proxy_add_x_forwarded_for", "request_id": "$req_id", "remote_user":"$remote_user",
          "bytes_sent": $bytes_sent, "request_time": $request_time, "status": $status, "vhost":
          "$host", "request_proto": "$server_protocol", "path": "$uri", "request_query":
          "$args", "request_length": $request_length, "duration": $request_time, "method":
          "$request_method", "http_referrer": "$http_referer", "http_user_agent": "$http_user_agent",
          "x_trace_id": "$http_traceid", "X-Real-IP": "$http_x_real_ip",
          "Sec-Fetch-User": "$http_sec_fetch_user", "Sec-CH-UA":  "$http_sec_ch_ua",
          "Sec-CH-UA-Mobile": "$http_sec_ch_ua_mobile", "Sec-CH-UA-Platform": "$http_sec_ch_ua_platform",
          "CF-Connecting-IP": "$http_cf_connecting_ip", "CF-IPCountry": "$http_cf_ipcountry",
          "Sec-Fetch-Dest":  "$http_sec_fetch_dest", "Sec-Fetch-Mode":  "$http_sec_fetch_mode",
          "Sec-Fetch-Site":  "$http_sec_fetch_site", "X-Forwarded-Host": "$http_x_forwarded_host",
          "CF-Ray":  "$http_cf_ray", "Connection":  "$http_connection", "CDN-Loop": "$http_cdn_loop",
          "Sec-CH-UA-Model": "$http_sec_ch_ua_model", "Sec-CH-UA-Platform-Version": "$http_sec_ch_ua_platform_version",}'
      admissionWebhooks:
        enabled: true
        patch:
          #nodeSelector:
          #  pool: infra
          #  CriticalAddonsOnly: enabled
          tolerations:
            #- key: CriticalAddonsOnly
            #  effect: NoSchedule
            #  operator:  Exists
            - key: pool
              value: infra
              operator: Equal
              effect: NoSchedule
      #nodeSelector:
      #  CriticalAddonsOnly: enabled
      #  pool: infra
      tolerations:
        #- key: CriticalAddonsOnly
        #  effect: NoSchedule
        #  operator:  Exists
        - key: pool
          value: infra
          operator: Equal
          effect: NoSchedule
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      replicaCount: 2
