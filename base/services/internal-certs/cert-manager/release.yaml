---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  uninstall:
    disableHooks: true
    keepHistory: false
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
      version: v1.19.0
  valuesFrom:
    - kind: ConfigMap
      name: cert-values
      valuesKey: values.yaml
