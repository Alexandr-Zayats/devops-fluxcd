---
global:
  security:
    allowInsecureImages: true
auth:
  username: ${RABBIT_USERNAME}
  password: ${RABBIT_PASSWORD}
  erlangCookie: 'k1233412'
  securePassword: false

image:
  registry: 000000000000.dkr.ecr.us-east-1.amazonaws.com
  repository: tools/rabbitmq
  tag: 1.0.198

persistence:
  storageClass: gp2

plugins: 'rabbitmq_management rabbitmq_peer_discovery_k8s rabbitmq_stream rabbitmq_consistent_hash_exchange'
# extraPlugins: "rabbitmq_auth_backend_ldap rabbitmq_stream"

extraContainerPorts:
  - name: stream
    containerPort: 5552

service:
  extraPorts:
    - name: stream
      port: 5552
      targetPort: stream
      protocol: TCP

extraConfiguration: |-
  deprecated_features.permit.management_metrics_collection = false
