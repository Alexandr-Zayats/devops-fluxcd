---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluentd
spec:
  releaseName: fluentd
  chart:
    spec:
      chart: fluentd
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: flux-system
      version: 0.4.3
  interval: 1h0m0s
  install:
    remediation:
      retries: 5
  values:
    #serviceAccount:
    #  create: 'true'
    #  annotations: {}
    #  name: 'fluentd'
    #rbac:
    #  create: 'true'
    #podSecurityPolicy:
    #  enabled: 'false'
    # livenessProbe:
    #   httpGet:
    #     path: '/'
    #     port: 'health'
    # readinessProbe:
    #   httpGet:
    #     path: '/'
    #     port: 'health'
    kind: DaemonSet
    variant: elasticsearch8
    nameOverride: fluentd
    fullnameOverride: fluentd
    image:
      pullPolicy: IfNotPresent
      repository: docker-apollo.suntechinnovation.com/images/fluentd-kubernetes-daemonset
      tag: v1-debian-1.15.3
      # repository: fluent/fluentd-kubernetes-daemonset
      # tag: v1-debian-elasticsearch8

    #envFrom:
    #  - secretRef:
    #      name: elasticsearch-es-elastic-user
    #      valuesKey: elastic
    #      targetPath: elastic
    
    configMapConfigs:
      - fluentd-prometheus-conf
      - common

    volumes:
      - name: etcfluentd-templates
        configMap:
          name: index-templates
          defaultMode: 0777

    volumeMounts:
      - name: etcfluentd-templates
        mountPath: /etc/fluent/templates

    service:
      type: ClusterIP
      ports:
      - name: http
        protocol: TCP
        containerPort: 24225
      - name: eks
        protocol: TCP
        containerPort: 24226

    annotations:
      configmap.reloader.stakater.com/reload: fluentd-config-fluentd

    plugins:
      - elasticsearch-xpack
      - fluent-plugin-elasticsearch -v '~> 5.1.1'

    fileConfigs:
      00_system.conf: |-
        #configure the logging level to error
        <system>
          log_level "#{ENV['FLUENT_LOG_LEVEL'] || 'error'}"
        </system>

      01_sources.conf: |-
        @include /etc/fluent/common.d/.source_forward.conf
        @include /etc/fluent/common.d/.source_logs.conf
    
      02_filters.conf: |-
        @include /etc/fluent/common.d/.filters_k8s.conf

      03_dispatch.conf: |-
        @include /etc/fluent/common.d/.dispatch_k8s.conf

      04_outputs.conf: ''
      05_outputs.conf: ''
