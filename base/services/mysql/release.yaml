---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${env}-${app}-mysql
  namespace: flux-system
spec:
  interval: 10m
  releaseName: mysql
  chart:
    spec:
      chart: mysql
      sourceRef:
        kind: HelmRepository
        name: bitnami-oci
        namespace: flux-system
      version: 12.2.4
  values:
    primary:
      tolerations:
        - key: pool
          value: infra
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/arch: arm64
    readReplicas:
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
        - key: pool
          value: infra
          effect: NoSchedule
  valuesFrom:
    - kind: ConfigMap
      name: mysql-values
      valuesKey: values.yaml
