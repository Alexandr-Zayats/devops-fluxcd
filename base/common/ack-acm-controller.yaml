---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ack-acm-controller
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  dependsOn:
    - name: node-pool.infra
  sourceRef:
    kind: GitRepository
    name: base
  path: infra/ack-acm-controller
  targetNamespace: services
  force: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: ack-acm-controller
      namespace: services
    - apiVersion: apps/v1
      kind: Deployment
      name: ack-acm-controller-acm-chart
      namespace: services
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: terraform-to-flux-bridge
        optional: true
