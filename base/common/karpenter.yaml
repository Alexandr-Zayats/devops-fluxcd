---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: karpenter
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  dependsOn:
    - name: karpenter-crd
  serviceAccountName: kustomize-controller
  sourceRef:
    kind: GitRepository
    name: base
    namespace: flux-system
  path: infra/karpenter
  force: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: karpenter
      namespace: kube-system
    - apiVersion: v1
      kind: Service
      name: karpenter
      namespace: kube-system
    - apiVersion: apps/v1
      kind: Deployment
      name: karpenter
      namespace: kube-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: terraform-to-flux-bridge
        optional: true
