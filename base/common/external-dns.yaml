---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  dependsOn:
    - name: kyverno
  targetNamespace: kube-system
  sourceRef:
    kind: GitRepository
    name: base
    namespace: flux-system
  path: infra/external-dns
  force: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-dns
      namespace: kube-system
    - apiVersion: apps/v1
      kind: Deployment
      name: external-dns
      namespace: kube-system
    - apiVersion: v1
      kind: Service
      name: external-dns
      namespace: kube-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: terraform-to-flux-bridge
        optional: true
