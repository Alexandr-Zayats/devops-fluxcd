---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  dependsOn:
    - name: kyverno
  sourceRef:
    kind: GitRepository
    name: base
  targetNamespace: services
  path: services/reloader
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: reloader-reloader
      namespace: services
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: terraform-to-flux-bridge
        optional: true
