---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus.crd
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  dependsOn:
    - name: node-pool.infra
  force: true
  targetNamespace: services
  sourceRef:
    kind: GitRepository
    name: base
    namespace: flux-system
  path: infra/monitoring/prometheus
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: prometheus-exporters
      namespace: services
    - apiVersion: v1
      kind: Service
      name: prometheus-exporters-kube-state-metrics
      namespace: services
    - apiVersion: v1
      kind: Service
      name: prometheus-exporters-prometheus-node-exporter
      namespace: services
    - apiVersion: apps/v1
      kind: DaemonSet
      name: prometheus-exporters-prometheus-node-exporter
      namespace: services
    - apiVersion: apps/v1
      kind: Deployment
      name: prometheus-exporters-kube-state-metrics
      namespace: services
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: prometheusagents.monitoring.coreos.com
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: prometheuses.monitoring.coreos.com
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: prometheusrules.monitoring.coreos.com
