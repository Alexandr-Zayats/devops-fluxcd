---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  dependsOn:
    - name: karpenter
    - name: node-pool.infra
  sourceRef:
    kind: GitRepository
    name: base
  targetNamespace: services
  path: services/external-secrets
  force: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: services
    - apiVersion: v1
      kind: Service
      name: external-secrets-webhook
      namespace: services
    - apiVersion: apps/v1
      kind: Deployment
      name: external-secrets
      namespace: services
    - apiVersion: apps/v1
      kind: Deployment
      name: external-secrets-cert-controller
      namespace: services
    - apiVersion: apps/v1
      kind: Deployment
      name: external-secrets-webhook
      namespace: services
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: terraform-to-flux-bridge
        optional: true
