---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  dependsOn:
    - name: node-pool.infra
  sourceRef:
    kind: GitRepository
    name: base
    namespace: flux-system
  path: infra/traefik
  force: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: traefik
      namespace: traefik
    - apiVersion: apps/v1
      kind: Deployment
      name: traefik
      namespace: traefik
    - apiVersion: v1
      kind: Service
      name: traefik
      namespace: traefik
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      name: traefik-internal
      namespace: traefik
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: terraform-to-flux-bridge
        optional: true
      - kind: ConfigMap
        name: dev.private-cert
        optional: false
