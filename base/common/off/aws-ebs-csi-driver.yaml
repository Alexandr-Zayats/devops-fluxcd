---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aws-ebs-csi-driver
  namespace: flux-system
spec:
  #dependsOn:
  #  - name: nodepools
  interval: 720m0s
  sourceRef:
    kind: GitRepository
    name: base
  targetNamespace: services
  path: ./common/installations/aws-ebs-csi-driver
  prune: true
  wait: true
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: terraform-to-flux-bridge
        optional: true
