---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: flux-system
spec:
  dependsOn:
    - name: kyverno
  interval: 720m0s
  targetNamespace: kube-system
  sourceRef:
    kind: GitRepository
    name: base
    namespace: flux-system
  path: ./common/installations/external-dns
  prune: true
  wait: true
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: terraform-to-flux-bridge
        optional: true
