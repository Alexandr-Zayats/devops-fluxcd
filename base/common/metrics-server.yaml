apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  chart:
    spec:
      chart: metrics-server
      sourceRef:
        kind: HelmRepository
        name: metrics-server
      # version: ">=1.15.0-0"
  interval: 30m
  timeout: 2m
  dependsOn:
    - name: karpenter
      namespace: kube-system
  releaseName: metrics-server
  targetNamespace: kube-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  uninstall:
    disableHooks: true
    keepHistory: false
  values:
    nodeSelector:
      kubernetes.io/arch: arm64
    tolerations:
      - effect: NoSchedule
        key: pool
        operator: Equal
        value: infra
