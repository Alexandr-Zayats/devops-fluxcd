---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  dependsOn:
    - name: node-pool.infra
  sourceRef:
    kind: GitRepository
    name: base
  targetNamespace: kyverno
  serviceAccountName: kustomize-controller
  path: services/kyverno
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: terraform-to-flux-bridge
        optional: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kyverno
      namespace: kyverno
    - apiVersion: v1
      kind: Service
      name: kyverno-background-controller-metrics
      namespace: kyverno
    - apiVersion: v1
      kind: Service
      name: kyverno-cleanup-controller
      namespace: kyverno
    - apiVersion: v1
      kind: Service
      name: kyverno-cleanup-controller-metrics
      namespace: kyverno
    - apiVersion: v1
      kind: Service
      name: kyverno-kyverno-svc
      namespace: kyverno
    - apiVersion: v1
      kind: Service
      name: kyverno-kyverno-svc-metrics
      namespace: kyverno
    - apiVersion: v1
      kind: Service
      name: kyverno-reports-controller-metrics
      namespace: kyverno
    - apiVersion: apps/v1
      kind: Deployment
      name: kyverno-admission-controller
      namespace: kyverno
    - apiVersion: apps/v1
      kind: Deployment
      name: kyverno-background-controller
      namespace: kyverno
    - apiVersion: apps/v1
      kind: Deployment
      name: kyverno-cleanup-controller
      namespace: kyverno
    - apiVersion: apps/v1
      kind: Deployment
      name: kyverno-reports-controller
      namespace: kyverno

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies
  namespace: flux-system
spec:
  dependsOn:
    - name: kyverno
  targetNamespace: kyverno
  interval: 60m0s
  sourceRef:
    kind: GitRepository
    name: base
  serviceAccountName: kustomize-controller
  path: ./services/kyverno-policies
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: terraform-to-flux-bridge
        optional: true
