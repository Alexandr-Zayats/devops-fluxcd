---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: statsd
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  dependsOn:
    - name: kyverno
  force: true
  targetNamespace: services
  sourceRef:
    kind: GitRepository
    name: base
    namespace: flux-system
  path: services/statsd
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: statsd
      namespace: services
    - apiVersion: v1
      kind: Service
      name: statsd
      namespace: services
    - apiVersion: apps/v1
      kind: Deployment
      name: statsd
      namespace: services
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: terraform-to-flux-bridge
