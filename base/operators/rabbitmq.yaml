---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rabbitmq-operator
spec:
  releaseName: rabbitmq-cluster-operator
  chart:
    spec:
      chart: rabbitmq-cluster-operator
      sourceRef:
        kind: HelmRepository
        name: bitnami-oci
        namespace: flux-system
      version: "4.4.1"
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  values:
    clusterOperator:
      tolerations:
        - effect: NoSchedule
          key: pool
          value: infra
    msgTopologyOperator:
      tolerations:
        - effect: NoSchedule
          key: pool
          value: infra
