---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
spec:
  releaseName: clickhouse-operator
  chart:
    spec:
      chart: clickhouse-operator
      sourceRef:
        kind: HelmRepository
        name: bitnami-oci
        namespace: flux-system
      version: 0.2.8
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  values:
    tolerations:
      - effect: NoSchedule
        key: pool
        value: infra
