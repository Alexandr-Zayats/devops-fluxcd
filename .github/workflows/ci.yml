name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install validator
        run: python -m pip install --requirement .github/requirements-ci.txt
      - name: Parse YAML manifests
        run: python .github/scripts/validate_yaml.py
      - name: Reject plaintext secret fields
        run: |
          if git grep -nEi '^\s*(password|client_secret|private_key|access_key|secret_key):\s*[^{$<[:space:]]' -- '*.yaml' '*.yml'; then
            echo "Potential plaintext secret value found"
            exit 1
          fi
